<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 380px; font: 13px system-ui, sans-serif; margin: 0; padding: 12px; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  button { flex: 1; padding: 8px; border: 0; border-radius: 6px; cursor: pointer; background: #e8e8e8; }
  button.primary { background: #1a73e8; color: #fff; }
  button.del { flex: 0; padding: 4px 8px; background: #fbe4e4; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 5px; }
  #list { max-height: 260px; overflow-y: auto; border-top: 1px solid #ddd; margin-top: 6px; }
  .item { padding: 6px 0; border-bottom: 1px solid #eee; }
  .item .k { font-weight: 600; font-size: 12px; color: #444; }
  .item .line { display: flex; gap: 6px; }
  #status { min-height: 16px; color: #0a7; margin: 4px 0; }
  details { margin-top: 8px; }
</style>
</head>
<body>
  <h3>Job Form Autofill</h3>
  <div class="row">
    <button id="fill" class="primary">Fill this page</button>
    <button id="scan">Save from this page</button>
  </div>
  <div id="status"></div>

  <details>
    <summary>Add a field manually</summary>
    <input type="text" id="mk" placeholder="Field name, e.g. father, mobile, ssc_roll" style="margin:6px 0">
    <input type="text" id="mv" placeholder="Value">
    <div class="row" style="margin-top:6px"><button id="add">Add</button></div>
  </details>

  <div id="list"></div>

  <details>
    <summary>Backup / restore</summary>
    <textarea id="bk" rows="4"></textarea>
    <div class="row" style="margin-top:6px">
      <button id="exp">Export</button><button id="imp">Import</button><button id="clr">Clear all</button>
    </div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
